services:
  pagepilot:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      FETCH_CONCURRENCY: "16"
      PARSE_CONCURRENCY: "2"
      GENERATION_CONCURRENCY: "16"
      REQUESTS_PER_MINUTE: "30"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped
